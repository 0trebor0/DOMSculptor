<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>DomSculptor browser tests</title></head>
<body>
<pre id="result">running</pre>
<script type="module">
import DomSculptor from '../src/index.js';
import { createLazyComponent } from '../src/index.js';
import BrowserDomSculptor from '../dist/domsculptor.esm.min.js';

let assertions = 0;
let assert = (condition, message) => {
    assertions++;
    if (!condition) throw new Error(message);
};

try {
    assert(typeof BrowserDomSculptor === 'function', 'browser ESM default export did not resolve');
    let browserSculptor = new BrowserDomSculptor();
    assert(browserSculptor.rendering === false, 'browser ESM class did not expose rendering status');
    let sculptor = new DomSculptor();
    let failedBoundarySignal;
    let BrokenBrowserComponent = sculptor.component(() => {
        failedBoundarySignal = sculptor.signal('owned');
        throw new Error('browser boundary failure');
    });
    let SafeBrowserComponent = sculptor.errorBoundary(
        BrokenBrowserComponent,
        error => sculptor.create('p').setText(error.message)
    );
    let safeBrowserInstance = SafeBrowserComponent({});
    assert(
        safeBrowserInstance.root.html.textContent === 'browser boundary failure',
        'browser component boundary did not render its fallback'
    );
    assert(failedBoundarySignal.disposed, 'browser component boundary leaked its failed scope');
    safeBrowserInstance.dispose();

    let BrowserLazy = createLazyComponent(
        sculptor,
        async () => sculptor.component(() => sculptor.create('strong').setText('lazy ready')),
        { loading: 'lazy loading' }
    );
    let lazyInstance = BrowserLazy({});
    sculptor.mount(lazyInstance, document.body);
    assert(lazyInstance.root.html.textContent === 'lazy loading', 'lazy loading fallback was not rendered');
    await new Promise(resolve => setTimeout(resolve));
    assert(lazyInstance.root.html.textContent === 'lazy ready', 'lazy browser component did not resolve');
    lazyInstance.dispose();

    let parent = sculptor.create('div');
    sculptor.mount(parent, document.body);
    let first = parent.child.create('span').setText('first');
    let second = parent.child.create('span').setText('second');
    let third = parent.child.create('span').setText('third');

    let chunkList = sculptor.create('ul');
    sculptor.mount(chunkList, document.body);
    let chunkItems = Object.freeze(Array.from(
        { length: 100 },
        (_, index) => Object.freeze({ label: `Item ${index}` })
    ));
    chunkItems.forEach(item => sculptor.createProgressively('li', chunkList).setText(item.label));
    assert(chunkList.children.length === 1, 'incremental rendering created more than one initial element');
    assert(sculptor.rendering, 'incremental rendering status did not become active');
    while (sculptor.rendering) await new Promise(resolve => requestAnimationFrame(resolve));
    assert(
        chunkList.children.length === 100 &&
        chunkList.children.every((element, index) => element.html.textContent === `Item ${index}`),
        'incremental rendering did not finish in source order'
    );
    chunkList.dispose();

    let cancelledList = sculptor.create('ul');
    let cancelledFirst = sculptor.createProgressively('li', cancelledList);
    let cancelledSecond = sculptor.createProgressively('li', cancelledList);
    cancelledList.dispose();
    assert(
        cancelledFirst.html === null && cancelledSecond.html === null && !sculptor.rendering,
        'disposing an incremental parent left queued elements alive'
    );

    let immediateList = sculptor.create('ul');
    sculptor.create('li', immediateList);
    sculptor.create('li', immediateList);
    assert(
        immediateList.children.length === 2 && !sculptor.rendering,
        'regular parented create did not mount synchronously'
    );
    immediateList.dispose();

    assert(parent.childrenOf()[0] === first, 'traversal created a duplicate wrapper');
    assert(sculptor.wrap(first.html) === first, 'wrap created a duplicate wrapper');

    let nativeParent = sculptor.create('div');
    let nativeChild = nativeParent.child.create('span');
    let nativeDestination = sculptor.create('div');
    nativeDestination.child.append(nativeChild.html);
    assert(nativeParent.children.length === 0 && nativeDestination.children[0] === nativeChild, 'native-node move left stale ownership');

    let nativeCreated = sculptor.create('em', nativeDestination.html);
    assert(nativeCreated.parent() === nativeDestination, 'native parent creation lost wrapper ownership');

    let externalSource = sculptor.create('div');
    let externalDestination = sculptor.create('div');
    let externalChild = externalSource.child.create('span');
    externalDestination.html.appendChild(externalChild.html);
    assert(externalChild.parent() === externalDestination && externalSource.children.length === 0, 'parent traversal did not reconcile an external DOM move');

    let externalSibling = sculptor.create('strong');
    externalChild.before(externalSibling);
    assert(externalDestination.children[0] === externalSibling && externalSibling.parent() === externalDestination, 'sibling insertion used stale parent ownership');

    let otherSculptor = new DomSculptor();
    assert(otherSculptor.wrap(externalChild.html) === externalChild, 'multiple sculptors created duplicate wrappers');

    let frame = document.createElement('iframe');
    document.body.appendChild(frame);
    let foreignParentNode = frame.contentDocument.createElement('div');
    frame.contentDocument.body.appendChild(foreignParentNode);
    let foreignParent = sculptor.wrap(foreignParentNode);
    let foreignChild = sculptor.create('span', foreignParentNode);
    assert(foreignParent.html === foreignParentNode && foreignChild.parent() === foreignParent, 'cross-realm nodes were rejected');

    let displayElement = sculptor.create('div').setStyle('display', 'grid');
    displayElement.hide().hide().show();
    assert(displayElement.html.style.display === 'grid', 'show did not restore the prior display value');

    let detachedNode = document.createElement('div');
    let detached = sculptor.wrap(detachedNode);
    let detachedChild = detached.child.create('span');
    let mountCalls = 0;
    detached.onMount(() => mountCalls++);
    detachedChild.onMount(() => mountCalls++);
    sculptor.wrap(document.body).child.append(detached);
    assert(mountCalls === 2, 'mount hooks did not propagate through an attached subtree');

    let textParent = sculptor.create('div');
    let textChild = textParent.child.create('span');
    textParent.setText('replacement');
    assert(textChild.html === null && textParent.children.length === 0, 'setText left stale child wrappers');

    let existingParentNode = document.createElement('div');
    let existingMiddleNode = document.createElement('section');
    let existingChildNode = document.createElement('span');
    existingMiddleNode.appendChild(existingChildNode);
    existingParentNode.appendChild(existingMiddleNode);
    document.body.appendChild(existingParentNode);
    let existingParent = sculptor.wrap(existingParentNode);
    let existingChild = sculptor.wrap(existingChildNode);
    existingParent.child.clear();
    assert(existingChild.html === null, 'clear did not clean a wrapped pre-existing descendant');

    let subtreeParent = sculptor.create('div');
    let subtreeContainerNode = document.createElement('section');
    let subtreeChildNode = document.createElement('span');
    subtreeContainerNode.appendChild(subtreeChildNode);
    subtreeParent.child.append(subtreeContainerNode);
    let subtreeChild = sculptor.wrap(subtreeChildNode);
    subtreeParent.child.replace(subtreeContainerNode, 'replacement');
    assert(subtreeChild.html === null, 'replace did not clean wrapped descendants of an unwrapped subtree');

    let errorParent = sculptor.create('div');
    let errorFirst = errorParent.child.create('span');
    let errorSecond = errorParent.child.create('span');
    let hookCalls = 0;
    let hookError = new Error('hook failed');
    errorFirst.onRemove(element => { hookCalls++; element.remove(); throw hookError; });
    errorFirst.onRemove(() => hookCalls++);
    try { errorParent.remove(); } catch (error) { assert(error === hookError, 'remove reported the wrong hook error'); }
    assert(hookCalls === 2 && errorParent.html === null && errorFirst.html === null && errorSecond.html === null, 'throwing lifecycle hook interrupted cleanup');

    let replaceErrorParent = sculptor.create('div');
    let replaceErrorPrevious = replaceErrorParent.child.create('span');
    let replaceErrorNext = sculptor.create('strong');
    let replaceError = new Error('replace cleanup failed');
    replaceErrorPrevious.onRemove(() => { throw replaceError; });
    try { replaceErrorParent.child.replace(replaceErrorPrevious, replaceErrorNext); } catch (error) { assert(error === replaceError, 'replace reported the wrong cleanup error'); }
    assert(replaceErrorPrevious.html === null && replaceErrorParent.children[0] === replaceErrorNext && replaceErrorParent.html.firstChild === replaceErrorNext.html, 'throwing replace hook left stale ownership');

    parent.child.replace(second, first);
    assert(parent.html.textContent === 'firstthird', 'same-parent replacement has incorrect DOM order');
    assert(parent.children.length === 2 && parent.children[0] === first && parent.children[1] === third, 'same-parent ownership is stale');

    let lifecycle = [];
    let mounted = sculptor.create('section')
        .onMount(() => lifecycle.push('mount'))
        .onRemove(() => lifecycle.push('remove'));
    sculptor.mount(mounted, document.body);
    mounted.remove();
    assert(lifecycle.join(',') === 'mount,remove', 'lifecycle hooks ran incorrectly');

    let temporary = sculptor.create('div');
    let temporaryChild = temporary.child.create('button').class.add('delegated');
    let lifecycleOrder = [];
    let delegatedCalls = 0;
    temporaryChild.onUnmount(() => lifecycleOrder.push('child-unmount'));
    temporary.onUnmount(() => lifecycleOrder.push('parent-unmount'));
    temporaryChild.onDispose(() => lifecycleOrder.push('child-dispose'));
    temporary.onDispose(() => lifecycleOrder.push('parent-dispose'));
    temporary.on('click', '.delegated', () => delegatedCalls++);
    sculptor.mount(temporary, document.body);
    temporaryChild.html.click();
    sculptor.unmount(temporary);
    sculptor.mount(temporary, document.body);
    temporaryChild.html.click();
    assert(delegatedCalls === 2, 'unmount destroyed delegated listeners');
    temporary.dispose();
    assert(
        lifecycleOrder.join(',') === 'child-unmount,parent-unmount,child-dispose,parent-dispose',
        'unmount/dispose lifecycle order was incorrect'
    );

    let value = sculptor.state('ready');
    let bound = sculptor.create('input');
    value.bindValue(bound);
    value.bindClass(bound, 'active', next => next === 'ready');
    value.bindAttribute(bound, 'data-state');
    assert(bound.getValue() === 'ready' && bound.class.contains('active'), 'initial direct binding failed');
    value.set('done');
    sculptor.flush();
    assert(bound.getValue() === 'done' && !bound.class.contains('active') && bound.attribute.get('data-state') === 'done', 'binding update failed');

    let firstName = sculptor.signal('Ada');
    let lastName = sculptor.signal('Lovelace');
    let fullName = sculptor.computed(() => `${firstName.get()} ${lastName.get()}`, [firstName, lastName]);
    let effectRuns = 0;
    let stopEffect = sculptor.effect(() => {
        fullName.get();
        effectRuns++;
    }, [fullName]);
    sculptor.batch(() => {
        firstName.set('Grace');
        lastName.set('Hopper');
    });
    sculptor.flush();
    assert(fullName.get() === 'Grace Hopper' && effectRuns === 2, 'computed/effect batching failed');
    stopEffect();
    fullName.dispose();

    let keyedItems = sculptor.signal([
        { id: 1, value: 'first' },
        { id: 2, value: 'second' },
        { id: 3, value: 'third' }
    ]);
    let keyedList = sculptor.create('ul');
    sculptor.mount(keyedList, document.body);
    keyedItems.list(keyedList, {
        key: item => item.id,
        render: item => {
            let row = sculptor.createDetached('li');
            row.child.append(sculptor.createDetached('input').setValue(item.value));
            return row;
        }
    });
    let focusedInput = keyedList.children[1].child.find('input').html;
    focusedInput.focus();
    focusedInput.setSelectionRange(1, 4);
    keyedItems.set([
        { id: 3, value: 'third' },
        { id: 2, value: 'second' },
        { id: 1, value: 'first' }
    ]);
    sculptor.flush();
    assert(keyedList.children[1].child.find('input').html === focusedInput, 'keyed reorder replaced a stable node');
    assert(document.activeElement === focusedInput, 'keyed reorder lost focus');
    assert(focusedInput.selectionStart === 1 && focusedInput.selectionEnd === 4, 'keyed reorder lost selection');

    let formValue = sculptor.signal('Ada');
    let formInput = sculptor.create('input');
    sculptor.mount(formInput, document.body);
    formValue.bind(formInput);
    formInput.html.focus();
    formInput.html.setSelectionRange(1, 1);
    formValue.set('Ada');
    sculptor.flush();
    assert(formInput.html.selectionStart === 1, 'equal form state write moved the caret');
    formInput.html.value = 'Grace';
    formInput.html.dispatchEvent(new InputEvent('input', { bubbles: true, data: 'e' }));
    assert(formValue.get() === 'Grace', 'text input did not update its signal');

    let selectedTags = sculptor.signal(['a']);
    let multiSelect = sculptor.create('select');
    multiSelect.html.multiple = true;
    multiSelect.html.append(new Option('A', 'a'), new Option('B', 'b'));
    selectedTags.bind(multiSelect);
    multiSelect.html.options[0].selected = false;
    multiSelect.html.options[1].selected = true;
    multiSelect.html.dispatchEvent(new Event('change', { bubbles: true }));
    assert(selectedTags.get().join(',') === 'b', 'multiple select binding failed');

    let focusButton = sculptor.create('button');
    sculptor.mount(focusButton, document.body);
    focusButton.focus({ preventScroll: true });
    assert(focusButton.isFocused(), 'focus helper did not focus the element');
    focusButton.blur();
    assert(!focusButton.isFocused(), 'blur helper did not release focus');
    let hiddenState = sculptor.signal(false);
    hiddenState.bindHidden(focusButton);
    let displayBeforeHiding = focusButton.html.style.display;
    hiddenState.set(true);
    sculptor.flush();
    assert(focusButton.html.style.display === 'none', 'hidden binding did not hide the element');
    hiddenState.set(false);
    sculptor.flush();
    assert(focusButton.html.style.display === displayBeforeHiding,
        'hidden binding did not restore the previous display value');

    let unsafeText = '<img src=x onerror=window.__unsafeTree=true>';
    let safeTree = sculptor.tree({ tag: 'div', text: unsafeText });
    sculptor.mount(safeTree, document.body);
    assert(
        safeTree.html.textContent === unsafeText && safeTree.html.querySelector('img') === null && !window.__unsafeTree,
        'tree text accepted unsafe HTML'
    );

    let svgNode = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    let circleNode = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    svgNode.appendChild(circleNode);
    document.body.appendChild(svgNode);
    let svg = sculptor.wrap(svgNode);
    let circle = sculptor.wrap(circleNode);
    circle.attribute.set({ cx: 12, cy: 8 });
    assert(svg.child.find('circle') === circle && circle.attribute.get('cx') === '12', 'SVG wrapping or attributes failed');

    let fragment = document.createDocumentFragment();
    let fragmentChild = document.createElement('mark');
    fragment.appendChild(fragmentChild);
    let fragmentHost = sculptor.create('div');
    fragmentHost.child.append(fragment);
    assert(fragmentHost.html.firstChild === fragmentChild && fragment.childNodes.length === 0, 'DocumentFragment insertion failed');

    if (!customElements.get('dom-sculptor-test')) {
        customElements.define('dom-sculptor-test', class extends HTMLElement {
            connectedCallback() { this.dataset.connected = 'yes'; }
        });
    }
    let customNode = document.createElement('dom-sculptor-test');
    let custom = sculptor.adopt(customNode);
    sculptor.mount(custom, document.body);
    assert(custom.html.dataset.connected === 'yes' && sculptor.wrap(customNode) === custom, 'custom element adoption failed');

    let shadowHost = sculptor.create('div');
    let shadowRoot = shadowHost.html.attachShadow({ mode: 'open' });
    let shadowButton = document.createElement('button');
    shadowButton.className = 'inside-shadow';
    shadowRoot.appendChild(shadowButton);
    let outsideShadowCalls = 0;
    let insideShadowCalls = 0;
    shadowHost.on('click', '.inside-shadow', () => outsideShadowCalls++);
    sculptor.wrap(shadowRoot).on('click', '.inside-shadow', () => insideShadowCalls++);
    shadowButton.click();
    assert(outsideShadowCalls === 0 && insideShadowCalls === 1, 'delegation crossed a shadow boundary incorrectly');

    let eventParent = sculptor.create('div');
    let eventChild = eventParent.child.create('button');
    let eventOrder = [];
    let onceCalls = 0;
    eventParent.on('click', () => eventOrder.push('capture'), { capture: true, passive: true });
    eventChild.on('click', () => eventOrder.push('bubble'));
    eventChild.once('click', () => onceCalls++);
    eventChild.html.click();
    eventChild.html.click();
    assert(eventOrder.join(',') === 'capture,bubble,capture,bubble' && onceCalls === 1, 'capture/passive/once event options failed');
    let eventController = new AbortController();
    let abortedEventCalls = 0;
    eventChild.on('click', () => abortedEventCalls++, { signal: eventController.signal });
    eventController.abort();
    eventChild.html.click();
    assert(abortedEventCalls === 0 && eventChild._listeners.click.length === 1, 'aborted event listener retained its callback');

    let checkboxValue = sculptor.signal(false);
    let checkbox = sculptor.create('input');
    checkbox.html.type = 'checkbox';
    checkboxValue.bind(checkbox);
    checkbox.html.checked = true;
    checkbox.html.dispatchEvent(new Event('change', { bubbles: true }));
    assert(checkboxValue.get() === true, 'checkbox binding failed in a browser');
    checkboxValue.set(false);
    sculptor.flush();
    assert(checkbox.html.checked === false, 'checkbox state did not update the control');

    let radioValue = sculptor.signal('first');
    let firstRadio = sculptor.create('input');
    let secondRadio = sculptor.create('input');
    firstRadio.html.type = secondRadio.html.type = 'radio';
    firstRadio.html.name = secondRadio.html.name = 'browser-radio';
    firstRadio.html.value = 'first';
    secondRadio.html.value = 'second';
    radioValue.bind(firstRadio);
    radioValue.bind(secondRadio);
    secondRadio.html.checked = true;
    secondRadio.html.dispatchEvent(new Event('change', { bubbles: true }));
    sculptor.flush();
    assert(radioValue.get() === 'second' && !firstRadio.html.checked && secondRadio.html.checked, 'radio binding failed in a browser');

    let textareaValue = sculptor.signal('first');
    let textarea = sculptor.create('textarea');
    textareaValue.bind(textarea);
    textarea.html.value = 'second';
    textarea.html.dispatchEvent(new InputEvent('input', { bubbles: true }));
    assert(textareaValue.get() === 'second', 'textarea binding failed in a browser');

    let dateValue = sculptor.signal('2026-07-25');
    let dateInput = sculptor.create('input');
    dateInput.html.type = 'date';
    dateValue.bind(dateInput);
    dateInput.html.value = '2026-08-01';
    dateInput.html.dispatchEvent(new Event('input', { bubbles: true }));
    assert(dateValue.get() === '2026-08-01', 'date input binding failed in a browser');

    let timeValue = sculptor.signal('09:30');
    let timeInput = sculptor.create('input');
    timeInput.html.type = 'time';
    timeValue.bind(timeInput);
    timeInput.html.value = '10:45';
    timeInput.html.dispatchEvent(new Event('input', { bubbles: true }));
    assert(timeValue.get() === '10:45', 'time input binding failed in a browser');

    let componentCleanup = 0;
    let BrowserCounter = sculptor.component(props => {
        let componentCount = sculptor.signal(props.initial);
        return {
            root: sculptor.tree({
                tag: 'button',
                text: componentCount,
                on: { click: () => componentCount.update(value => value + 1) }
            }),
            api: { count: componentCount },
            dispose: () => componentCleanup++
        };
    });
    let browserCounter = BrowserCounter({ initial: 4 });
    sculptor.mount(browserCounter, document.body);
    browserCounter.root.html.click();
    sculptor.flush();
    assert(browserCounter.root.html.textContent === '5', 'component signal did not render');
    browserCounter.dispose();
    assert(browserCounter.root.html === null && browserCounter.api.count.disposed, 'component scope did not dispose resources');
    assert(componentCleanup === 1, 'component custom cleanup did not run exactly once');

    let componentFragment = document.createDocumentFragment();
    let fragmentFirst = sculptor.createDetached('span').setText('first');
    let fragmentSecond = document.createElement('strong');
    fragmentSecond.textContent = 'second';
    componentFragment.append(fragmentFirst.html, fragmentSecond);
    let FragmentComponent = sculptor.component(() => ({ root: componentFragment }));
    let fragmentComponent = FragmentComponent();
    let fragmentParent = sculptor.create('div');
    sculptor.mount(fragmentComponent, fragmentParent);
    assert(fragmentParent.html.textContent === 'firstsecond', 'fragment component did not mount all root nodes');
    sculptor.unmount(fragmentComponent);
    assert(fragmentParent.html.childNodes.length === 0 && componentFragment.childNodes.length === 2, 'fragment component did not unmount intact');
    sculptor.mount(fragmentComponent, fragmentParent);
    assert(fragmentParent.html.firstChild === fragmentFirst.html, 'fragment component did not preserve node identity');
    fragmentComponent.dispose();
    assert(fragmentParent.html.childNodes.length === 0 && fragmentFirst.html === null, 'fragment component did not dispose mounted nodes');

    let olderResolve;
    let request = sculptor.asyncState();
    let older = request.run(() => new Promise(resolve => { olderResolve = resolve; }));
    let newer = request.run(() => Promise.resolve('newer'));
    await newer;
    olderResolve('older');
    await older;
    assert(request.get().data === 'newer', 'older async result overwrote newer state');

    parent.child.clear();
    assert(parent.html.childNodes.length === 0 && parent.children.length === 0, 'child.clear left stale children');

    let virtualSculptor = new DomSculptor();
    let virtualRecords = Array.from({ length: 9000 }, (_, id) => ({ id, label: 'Row ' + id }));
    let virtualHost = virtualSculptor.create('div').setStyle({
        height: '600px',
        overflow: 'auto',
        position: 'relative'
    });
    virtualSculptor.mount(virtualHost, document.body);
    let builtRows = 0;
    virtualSculptor.virtualList(virtualRecords, virtualHost, {
        rowHeight: 48,
        overscan: 6,
        key: item => item.id,
        render(item) {
            builtRows++;
            let root = virtualSculptor.createDetached('div');
            let label = root.child.create('span');
            let current = item;
            label.setText(item.label);
            return {
                root,
                update(nextItem) {
                    current = nextItem;
                    label.setText(nextItem.label);
                },
                currentId: () => current.id
            };
        }
    });
    let nextFrame = () => new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));

    let initialStatus = virtualSculptor.virtualListStatus(virtualHost);
    assert(initialStatus.total === 9000, 'virtual list did not record the full collection');
    assert(initialStatus.mounted <= 60, `virtual list mounted ${initialStatus.mounted} rows`);
    assert(builtRows === initialStatus.mounted, 'virtual list built rows outside the visible range');
    assert(virtualHost.html.querySelectorAll('div > span').length === initialStatus.mounted,
        'virtual list mounted a different number of nodes than it reported');
    assert(virtualHost.html.scrollHeight >= 9000 * 48, 'virtual list spacer did not represent the collection');
    assert(virtualHost.html.firstChild.style.height === (9000 * 48) + 'px', 'virtual spacer height was wrong');

    virtualHost.html.scrollTop = 4000 * 48;
    await nextFrame();
    let scrolledStatus = virtualSculptor.virtualListStatus(virtualHost);
    assert(scrolledStatus.start > 3900 && scrolledStatus.start <= 4000, 'virtual list range did not follow scrolling');
    assert(scrolledStatus.mounted <= 60, 'virtual list grew past its overscan while scrolling');
    assert(virtualHost.html.textContent.includes('Row 4000'), 'virtual list did not render the scrolled range');
    assert(!virtualHost.html.textContent.includes('Row 0<'), 'virtual list kept an offscreen row mounted');

    // Rapid scrolling must collapse into a single pass and land on the final position.
    for (let step = 0; step < 10; step++) virtualHost.html.scrollTop = (5000 + step * 20) * 48;
    await nextFrame();
    assert(virtualSculptor.virtualListStatus(virtualHost).rendering === false, 'virtual list left work pending');
    assert(virtualHost.html.textContent.includes('Row 5180'), 'virtual list did not settle on the final scroll position');

    assert(virtualSculptor.scrollVirtualList(virtualHost, 8999, { align: 'end' }) === true,
        'scrollVirtualList rejected a valid index');
    await nextFrame();
    assert(virtualHost.html.textContent.includes('Row 8999'), 'scroll-to-index did not reach the last row');
    assert(virtualSculptor.virtualListStatus(virtualHost).end === 9000, 'virtual list overran the collection end');

    assert(virtualSculptor.scrollVirtualList(virtualHost, { key: 12, align: 'start' }) === true,
        'scroll-to-key rejected an existing key');
    await nextFrame();
    assert(virtualHost.html.textContent.includes('Row 12'), 'scroll-to-key did not reach the row');
    assert(virtualSculptor.scrollVirtualList(virtualHost, { key: 'absent' }) === false,
        'scroll-to-key accepted a missing key');

    virtualSculptor.updateVirtualList(virtualHost, virtualRecords.slice(0, 20));
    await nextFrame();
    let shrunk = virtualSculptor.virtualListStatus(virtualHost);
    assert(shrunk.total === 20, 'virtual list did not accept a smaller collection');
    assert(virtualHost.html.scrollTop <= 20 * 48, 'virtual list left a stale scroll position');

    virtualSculptor.disposeVirtualList(virtualHost);
    assert(virtualSculptor.virtualListStatus(virtualHost) === null, 'virtual list survived explicit disposal');
    assert(virtualHost.html.childNodes.length === 0, 'virtual list left nodes behind');
    assert(virtualHost.html !== null, 'explicit virtual disposal removed the container');
    virtualSculptor.dispose();

    let routerSculptor = new DomSculptor();
    let routerHost = routerSculptor.create('main');
    routerSculptor.mount(routerHost, document.body);
    let routerDisposals = [];
    let startPath = location.pathname;
    let appRouter = routerSculptor.router({
        [startPath]: () => routerSculptor.createDetached('div').setText('start'),
        '/posts/:slug': snapshot => {
            let view = routerSculptor.createDetached('div').setText('post ' + snapshot.params.slug);
            view.onDispose(() => routerDisposals.push(snapshot.params.slug));
            return view;
        },
        '*': () => routerSculptor.createDetached('div').setText('missing')
    }, { parent: routerHost });
    assert(routerHost.html.textContent === 'start', 'router did not mount the initial route');
    appRouter.navigate('/posts/hello');
    routerSculptor.flush();
    assert(routerHost.html.textContent === 'post hello', 'router did not mount a parameterised route');
    assert(location.pathname === '/posts/hello', 'router did not push the new path');
    assert(appRouter.current.get().params.slug === 'hello', 'router did not expose route parameters');
    appRouter.navigate('/posts/second');
    routerSculptor.flush();
    assert(routerDisposals.join() === 'hello', 'router did not dispose the replaced view');
    assert(routerHost.html.childNodes.length === 1, 'router left more than one view mounted');
    await new Promise(resolve => {
        let onPop = () => { window.removeEventListener('popstate', onPop); resolve(); };
        window.addEventListener('popstate', onPop);
        history.back();
    });
    routerSculptor.flush();
    assert(routerHost.html.textContent === 'post hello', 'router did not follow browser history');
    appRouter.navigate('/definitely-not-a-route');
    routerSculptor.flush();
    assert(appRouter.current.get().route === '*', 'router did not fall back to the catch-all route');
    routerSculptor.dispose();
    assert(appRouter.stopped === true, 'runtime disposal did not stop the router');
    history.replaceState({}, '', startPath);

    let ownershipSculptor = new DomSculptor();
    let ownedHost = ownershipSculptor.create('div');
    ownershipSculptor.mount(ownedHost, document.body);
    let ownedSignal = ownershipSculptor.signal('owned');
    let ownedComputed = ownershipSculptor.computed(() => ownedSignal.get().toUpperCase());
    let adoptedNode = document.createElement('section');
    document.body.appendChild(adoptedNode);
    let adoptedClicks = 0;
    ownershipSculptor.adopt(adoptedNode).on('click', () => adoptedClicks++);
    adoptedNode.click();
    assert(ownedComputed.get() === 'OWNED' && adoptedClicks === 1, 'runtime ownership fixture did not initialise');
    ownershipSculptor.dispose();
    assert(ownershipSculptor.disposed === true, 'sculptor did not report disposal');
    assert(ownedSignal.disposed && ownedComputed.disposed, 'runtime disposal left reactive values alive');
    assert(ownedHost.html === null, 'runtime disposal left a created element mounted');
    adoptedNode.click();
    assert(adoptedNode.parentNode === document.body, 'runtime disposal removed a node it did not create');
    assert(adoptedClicks === 1, 'runtime disposal left a listener attached to an adopted node');
    adoptedNode.remove();
    ownershipSculptor.dispose();

    let trackedSource = sculptor.signal(2);
    let trackedBranch = sculptor.signal(true);
    let trackedAlternative = sculptor.signal(100);
    let trackedEvaluations = 0;
    let trackedComputed = sculptor.computed(() => {
        trackedEvaluations++;
        return trackedBranch.get() ? trackedSource.get() * 2 : trackedAlternative.get();
    });
    assert(trackedComputed.get() === 4, 'automatic tracking did not compute an initial value');
    trackedAlternative.set(200);
    assert(trackedEvaluations === 1, 'an unread branch was tracked as a dependency');
    trackedSource.set(5);
    assert(trackedComputed.get() === 10 && trackedEvaluations === 2, 'automatic tracking did not recompute');
    trackedBranch.set(false);
    assert(trackedComputed.get() === 200, 'automatic tracking did not follow the new branch');
    trackedSource.set(9);
    assert(trackedComputed.get() === 200, 'an abandoned dependency still triggered recomputation');
    let trackedEffectRuns = 0;
    let stopTrackedEffect = sculptor.effect(() => {
        trackedSource.get();
        trackedEffectRuns++;
    });
    trackedSource.set(11);
    sculptor.flush();
    assert(trackedEffectRuns === 2, 'an automatically tracked effect did not rerun');
    stopTrackedEffect();
    trackedComputed.dispose();

    let profile = sculptor.store({ name: 'Ada', role: 'engineer' });
    assert(profile.has('name') && !profile.has('missing'), 'store.has did not report key membership');
    let roleSignal = profile.signal('role');
    let roleLabel = sculptor.create('p');
    roleSignal.bindText(roleLabel);
    profile.set('role', 'director');
    sculptor.flush();
    assert(roleLabel.html.textContent === 'director', 'store.signal did not share the live key signal');
    let roleChanges = [];
    profile.onChange('role', (next, previous) => roleChanges.push([next, previous]));
    assert(profile.delete('role') === true, 'store.delete did not report a removed key');
    assert(!profile.has('role') && profile.get('role') === undefined, 'store.delete left the key readable');
    assert(profile.delete('role') === false, 'store.delete reported a second removal');
    profile.set('role', 'architect');
    assert(roleChanges.length === 2 && roleChanges[1][0] === 'architect', 'observers did not survive a deleted key returning');
    roleLabel.dispose();
    profile.dispose();

    let disposedElement = sculptor.create('input');
    disposedElement.dispose();
    for (let [method, args] of [
        ['on', ['click', () => {}]],
        ['once', ['click', () => {}]],
        ['getValue', []],
        ['setValue', ['x']],
        ['hide', []],
        ['show', []]
    ]) {
        let reported = false;
        try { disposedElement[method](...args); } catch (error) { reported = /disposed/.test(error.message); }
        assert(reported, `${method} did not report use of a disposed element`);
    }

    document.querySelector('#result').textContent = JSON.stringify({ ok: true, assertions });
} catch (error) {
    document.querySelector('#result').textContent = JSON.stringify({ ok: false, message: error.message, stack: error.stack });
    console.error(error);
}
</script>
</body>
</html>
